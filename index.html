<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Ruuvo</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
    rel="stylesheet"
  />

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {

      --bg: #e8e5df;

      --green: #445f40;
      --red: #a55a52;
    }

    html {
      scroll-behavior: smooth;
    }

    body {

      font-family: 'Inter', sans-serif;

      background: var(--bg);

      overflow-x: hidden;

      min-height: 320vh;

      position: relative;
    }

    /* ---------------- */
    /* STAR BACKGROUND  */
    /* ---------------- */

    .stars {

      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      pointer-events: none;

      z-index: -3;
    }

    .star {

      position: absolute;

      border-radius: 50%;

      background: rgba(0,0,0,0.55);

      animation:
        twinkle ease-in-out infinite;
    }

    @keyframes twinkle {

      0%, 100% {
        opacity: 0.15;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.8);
      }
    }

    /* ------------ */
    /* HERO SECTION */
    /* ------------ */

    .hero {

      position: relative;

      min-height: 200vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding-top: 70px;
    }

    /* -------- */
    /* TITLE    */
    /* -------- */

    .title {

      position: fixed;

      top: 25px;
      left: 50%;

      transform:
        translateX(-50%)
        scale(1);

      transform-origin: center top;

      font-size: clamp(3.5rem, 10vw, 8rem);

      font-weight: 900;

      line-height: 1.1;

      letter-spacing: -0.045em;

      /* Prevent cutoff */
      padding-right: 0.12em;
      padding-bottom: 0.08em;

      white-space: nowrap;

      z-index: 20;

      background: linear-gradient(
        90deg,
        var(--green),
        #756754,
        var(--red)
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      background-clip: text;
      color: transparent;

      will-change: transform;
    }

    /* ---------------- */
    /* INTRO CONTENT    */
    /* ---------------- */

    .intro-wrapper {

      margin-top: 180px;

      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 22px;

      position: relative;

      z-index: 5;
    }

    /* ---------------- */
    /* GLASS CARDS      */
    /* ---------------- */

    .intro-card {

      position: relative;

      width: min(760px, 88vw);

      padding:
        28px 34px;

      border-radius: 28px;

      background:
        rgba(255,255,255,0.18);

      backdrop-filter:
        blur(14px);

      -webkit-backdrop-filter:
        blur(14px);

      box-shadow:
        0 10px 35px rgba(0,0,0,0.04);

      overflow: hidden;

      animation:
        floatCard 5s ease-in-out infinite;
    }

    .main-card {
      rotate: -1deg;
    }

    .small-card {

      width: min(520px, 82vw);

      margin-left: -120px;

      rotate: 1deg;

      animation-delay: 0.8s;
    }

    .twitter-card {

      width: min(560px, 84vw);

      margin-right: -90px;

      rotate: -1deg;

      animation-delay: 1.5s;
    }

    /* ---------------- */
    /* TEXT             */
    /* ---------------- */

    .intro-text {

      font-size:
        clamp(1.05rem, 2vw, 1.35rem);

      line-height: 1.8;

      font-weight: 700;

      color:
        rgba(0,0,0,0.70);

      letter-spacing: -0.02em;
    }

    .small-text {

      font-size:
        clamp(1rem, 1.7vw, 1.15rem);
    }

    /* ---------------- */
    /* FLOATING EFFECT  */
    /* ---------------- */

    @keyframes floatCard {

      0%, 100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    /* ---------------- */
    /* SPARKLES         */
    /* ---------------- */

    .sparkle {

      position: absolute;

      color:
        rgba(255,255,255,0.85);

      text-shadow:
        0 0 12px rgba(255,255,255,0.8);

      animation:
        sparkleFloat 4s ease-in-out infinite;
    }

    .sparkle-1 {

      top: 12px;
      right: 18px;

      font-size: 1.4rem;
    }

    .sparkle-2 {

      bottom: 18px;
      left: 20px;

      font-size: 1rem;

      animation-delay: 1s;
    }

    .sparkle-3 {

      top: 50%;
      right: 42px;

      font-size: 0.9rem;

      animation-delay: 2s;
    }

    @keyframes sparkleFloat {

      0%, 100% {

        transform:
          translateY(0px)
          scale(1);

        opacity: 0.7;
      }

      50% {

        transform:
          translateY(-6px)
          scale(1.15);

        opacity: 1;
      }
    }

    /* ---------------- */
    /* RAINBOW BALL     */
    /* ---------------- */

    .rainbow-ball {

      position: fixed;

      width: 30px;
      height: 30px;

      border-radius: 50%;

      top: 72%;
      left: 15%;

      cursor: pointer;

      z-index: 25;

      background:
        radial-gradient(
          circle at 30% 30%,
          rgba(255,255,255,0.98),
          rgba(255,255,255,0.08) 30%,
          transparent 45%
        ),
        conic-gradient(
          from 0deg,
          #ff5f6d,
          #ff9966,
          #ffd166,
          #47cf73,
          #4facfe,
          #7b61ff,
          #ff5f6d
        );

      box-shadow:
        0 0 18px rgba(255,255,255,0.35),
        0 0 35px rgba(255,255,255,0.12);

      transition:
        left 2.2s cubic-bezier(.22,1,.36,1),
        top 2.2s cubic-bezier(.22,1,.36,1),
        transform 0.15s ease;

      will-change:
        left,
        top,
        transform;

      backface-visibility: hidden;

      transform:
        translateZ(0);
    }

    .rainbow-ball:hover {
      transform:
        translateZ(0)
        scale(1.15);
    }

    /* ---------------- */
    /* COUNTER          */
    /* ---------------- */

    .click-counter {

      position: fixed;

      left: 15%;
      top: calc(72% - 24px);

      transform: translateX(-50%);

      font-size: 1rem;
      font-weight: 700;

      color: rgba(0,0,0,0.7);

      opacity: 0;

      pointer-events: none;

      z-index: 30;

      transition:
        left 2.2s cubic-bezier(.22,1,.36,1),
        top 2.2s cubic-bezier(.22,1,.36,1),
        opacity 0.35s ease;
    }

    .click-counter.visible {
      opacity: 1;
    }

    /* ---------------- */
    /* BALL SPIN        */
    /* ---------------- */

    .rainbow-ball.spinning {

      animation:
        rainbowSpin 1.2s linear infinite;
    }

    .rainbow-ball.slowing {

      animation:
        rainbowSlow 1.4s cubic-bezier(.22,1,.36,1) forwards;
    }

    @keyframes rainbowSpin {

      from {
        transform:
          translateZ(0)
          rotate(0deg);
      }

      to {
        transform:
          translateZ(0)
          rotate(360deg);
      }
    }

    @keyframes rainbowSlow {

      from {
        transform:
          translateZ(0)
          rotate(0deg);
      }

      to {
        transform:
          translateZ(0)
          rotate(180deg);
      }
    }

    /* ---------------- */
    /* MOBILE           */
    /* ---------------- */

    @media (max-width: 768px) {

      body {
        min-height: 280vh;
      }

      .hero {

        padding-top: 60px;
      }

      .title {

        top: 18px;

        padding-right: 0.14em;
      }

      .intro-wrapper {

        margin-top: 130px;

        gap: 18px;
      }

      .intro-card {

        padding:
          22px 22px;
      }

      .small-card,
      .twitter-card {

        margin-left: 0;
        margin-right: 0;
      }

      .rainbow-ball {

        width: 26px;
        height: 26px;
      }
    }

  </style>
</head>

<body>

  <!-- Stars -->
  <div
    class="stars"
    id="stars"
  ></div>

  <!-- Counter -->
  <div
    class="click-counter"
    id="clickCounter"
  >
    0
  </div>

  <!-- Rainbow Ball -->
  <div
    class="rainbow-ball"
    id="rainbowBall"
  ></div>

  <!-- Hero -->
  <section class="hero">

    <!-- Title -->
    <h1
      class="title"
      id="title"
    >
      Ruuvo
    </h1>

    <!-- Content Under Title -->
    <div class="intro-wrapper">

      <div class="intro-card main-card">

        <div class="sparkle sparkle-1">✦</div>
        <div class="sparkle sparkle-2">✧</div>
        <div class="sparkle sparkle-3">★</div>

        <p class="intro-text">
          Haiiii Haiii, Im Ruuvo or Liam.
          I makes stuff on da internet.
          Mostlyy 3d remders whem i feel like itt
          and den stuffs like dis even morr sometimes.
        </p>

      </div>

      <div class="intro-card small-card">

        <p class="intro-text small-text">
          This is is justs a rndom side thing
          cause boreds.
        </p>

      </div>

      <div class="intro-card twitter-card">

        <p class="intro-text small-text">
          Feel free 2 dm me on twitter
          4 anythimg u wann ^v^
        </p>

      </div>

    </div>

  </section>

  <script>

    const title =
      document.getElementById("title");

    const starsContainer =
      document.getElementById("stars");

    const rainbowBall =
      document.getElementById("rainbowBall");

    const clickCounter =
      document.getElementById("clickCounter");

    /* ---------------------- */
    /* STAR GENERATOR         */
    /* ---------------------- */

    function createStars() {

      starsContainer.innerHTML = "";

      const pageWidth =
        window.innerWidth;

      const pageHeight =
        window.innerHeight;

      const STAR_COUNT = Math.floor(
        (pageWidth * pageHeight) / 8500
      );

      for (let i = 0; i < STAR_COUNT; i++) {

        const star =
          document.createElement("div");

        star.classList.add("star");

        star.style.left =
          Math.random() * pageWidth + "px";

        star.style.top =
          Math.random() * pageHeight + "px";

        let size;

        if (pageWidth < 768) {

          size =
            Math.random() * 4 + 3;

        } else {

          if (Math.random() > 0.94) {

            size =
              Math.random() * 12 + 5;

          } else {

            size =
              Math.random() * 3 + 2;
          }
        }

        star.style.width =
          size + "px";

        star.style.height =
          size + "px";

        star.style.opacity =
          Math.random() * 0.8 + 0.2;

        star.style.animationDuration =
          (Math.random() * 4 + 3) + "s";

        star.style.animationDelay =
          Math.random() * 5 + "s";

        starsContainer.appendChild(star);
      }
    }

    createStars();

    window.addEventListener(
      "resize",
      createStars
    );

    /* ---------------- */
    /* TITLE SCALING    */
    /* ---------------- */

    window.addEventListener(
      "scroll",
      () => {

        const scrollY =
          window.scrollY;

        const scale = Math.max(
          0.4,
          1 - scrollY / 1000
        );

        title.style.transform =
          `translateX(-50%) scale(${scale})`;
      }
    );

    /* ---------------- */
    /* RAINBOW BALL     */
    /* ---------------- */

    let currentX =
      window.innerWidth * 0.15;

    let currentY =
      window.innerHeight * 0.72;

    let spinningTimeout;

    let clickCount = 0;

    rainbowBall.addEventListener(
      "click",
      () => {

        clickCount++;

        clickCounter.textContent =
          clickCount;

        clickCounter.classList.add(
          "visible"
        );

        clearTimeout(
          spinningTimeout
        );

        rainbowBall.classList.remove(
          "slowing"
        );

        rainbowBall.classList.add(
          "spinning"
        );

        const margin = 60;

        const maxX =
          window.innerWidth - margin;

        const maxY =
          window.innerHeight - margin;

        let randomX;
        let randomY;

        let distance = 0;

        while (distance < 220) {

          randomX =
            Math.random() * maxX;

          randomY =
            Math.random() * maxY;

          distance = Math.sqrt(
            Math.pow(randomX - currentX, 2) +
            Math.pow(randomY - currentY, 2)
          );
        }

        currentX = randomX;
        currentY = randomY;

        rainbowBall.style.left =
          randomX + "px";

        rainbowBall.style.top =
          randomY + "px";

        clickCounter.style.left =
          randomX + "px";

        clickCounter.style.top =
          (randomY - 24) + "px";

        spinningTimeout = setTimeout(
          () => {

            rainbowBall.classList.remove(
              "spinning"
            );

            rainbowBall.classList.add(
              "slowing"
            );

            clickCounter.classList.remove(
              "visible"
            );

            setTimeout(() => {

              rainbowBall.classList.remove(
                "slowing"
              );

            }, 1400);

          },
          2200
        );
      }
    );

  </script>

</body>
</html>
