<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ruuvo</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #e8e5df;

      --green: #445f40;
      --red: #a55a52;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;

      background: var(--bg);

      overflow-x: hidden;

      min-height: 100vh;

      position: relative;
    }

    /* ---------------- */
    /* STAR BACKGROUND  */
    /* ---------------- */

    .stars {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      pointer-events: none;

      z-index: -3;
    }

    .star {
      position: absolute;

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.38);

      animation-name: twinkle;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;

      will-change: transform, opacity;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.15;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.8);
      }
    }

    /* ------------ */
    /* HERO SECTION */
    /* ------------ */

    .hero {
      min-height: 300vh;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      position: relative;

      padding-top: 90px;
    }

    /* -------- */
    /* TITLE    */
    /* -------- */

    .title {
      position: fixed;

      top: 25px;
      left: 50%;

      transform:
        translateX(-50%)
        scale(1);

      transform-origin: center top;

      font-size: clamp(3.5rem, 10vw, 8rem);

      font-weight: 900;

      line-height: 1.2;

      letter-spacing: -0.045em;

      padding-right: 0.08em;

      white-space: nowrap;

      z-index: 10;

      will-change: transform;

      background: linear-gradient(
        90deg,
        var(--green),
        #756754,
        var(--red)
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      background-clip: text;
      color: transparent;
    }

    /* ---------- */
    /* BACK GLOW  */
    /* ---------- */

    .hero::before {
      content: "";

      position: fixed;

      width: 900px;
      height: 900px;

      top: 40%;
      left: 50%;

      transform: translate(-50%, -50%);

      background: radial-gradient(
        circle,
        rgba(68, 95, 64, 0.10),
        rgba(165, 90, 82, 0.08),
        transparent 70%
      );

      filter: blur(50px);

      pointer-events: none;

      z-index: -2;
    }

    /* ------------- */
    /* MOBILE TWEAKS */
    /* ------------- */

    @media (max-width: 768px) {
      .title {
        top: 18px;
      }
    }

  </style>
</head>

<body>

  <!-- Stars -->
  <div class="stars" id="stars"></div>

  <!-- Hero -->
  <section class="hero">
    <h1 class="title" id="title">
      Ruuvo
    </h1>
  </section>

  <script>

    const title = document.getElementById("title");
    const starsContainer = document.getElementById("stars");

    /* ---------------------- */
    /* DYNAMIC STAR GENERATOR */
    /* ---------------------- */

    function createStars() {

      // Remove old stars
      starsContainer.innerHTML = "";

      const pageHeight =
        document.body.scrollHeight;

      const pageWidth =
        window.innerWidth;

      // Dynamic amount based on
      // page area
      const STAR_COUNT = Math.floor(
        (pageWidth * pageHeight) / 18000
      );

      for (let i = 0; i < STAR_COUNT; i++) {

        const star =
          document.createElement("div");

        star.classList.add("star");

        // Random position
        star.style.left =
          Math.random() * pageWidth + "px";

        star.style.top =
          Math.random() * pageHeight + "px";

        /* ---------------- */
        /* DYNAMIC STAR SIZE */
        /* ---------------- */

        let size;

        // Occasional large stars
        if (Math.random() > 0.94) {

          size =
            Math.random() * 10 + 4;

        } else {

          size =
            Math.random() *
            (pageWidth / 700) +
            1.5;
        }

        star.style.width =
          size + "px";

        star.style.height =
          size + "px";

        // Brightness variation
        star.style.opacity =
          Math.random() * 0.8 + 0.2;

        // Twinkle timing
        star.style.animationDuration =
          (Math.random() * 4 + 3) + "s";

        star.style.animationDelay =
          Math.random() * 5 + "s";

        starsContainer.appendChild(star);
      }
    }

    // Initial stars
    createStars();

    // Rebuild on resize
    window.addEventListener(
      "resize",
      createStars
    );

    /* ---------------- */
    /* TITLE ANIMATION  */
    /* ---------------- */

    window.addEventListener(
      "scroll",
      () => {

        const scrollY =
          window.scrollY;

        // Shrink smoothly
        const scale = Math.max(
          0.4,
          1 - scrollY / 1000
        );

        title.style.transform =
          `translateX(-50%) scale(${scale})`;
      }
    );

  </script>

</body>
</html>
