<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Ruuvo</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
    rel="stylesheet"
  />

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {

      --bg: #e8e5df;

      --green: #445f40;
      --red: #a55a52;
    }

    html {
      scroll-behavior: smooth;
    }

    body {

      font-family: 'Inter', sans-serif;

      background: var(--bg);

      overflow-x: hidden;

      min-height: 100vh;

      position: relative;
    }

    /* ---------------- */
    /* STAR BACKGROUND  */
    /* ---------------- */

    .stars {

      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      pointer-events: none;

      z-index: -3;
    }

    .star {

      position: absolute;

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.55);

      animation-name: twinkle;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;

      will-change: transform, opacity;
    }

    @keyframes twinkle {

      0%, 100% {
        opacity: 0.15;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.8);
      }
    }

    /* ------------ */
    /* HERO SECTION */
    /* ------------ */

    .hero {

      min-height: 300vh;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      position: relative;

      padding-top: 90px;
    }

    /* -------- */
    /* TITLE    */
    /* -------- */

    .title {

      position: fixed;

      top: 25px;
      left: 50%;

      transform:
        translateX(-50%)
        scale(1);

      transform-origin: center top;

      font-size: clamp(3.5rem, 10vw, 8rem);

      font-weight: 900;

      line-height: 1.2;

      letter-spacing: -0.045em;

      padding-right: 0.08em;

      white-space: nowrap;

      z-index: 10;

      will-change: transform;

      background: linear-gradient(
        90deg,
        var(--green),
        #756754,
        var(--red)
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      background-clip: text;
      color: transparent;
    }

    /* ---------- */
    /* BACK GLOW  */
    /* ---------- */

    .hero::before {

      content: "";

      position: fixed;

      width: 900px;
      height: 900px;

      top: 40%;
      left: 50%;

      transform: translate(-50%, -50%);

      background: radial-gradient(
        circle,
        rgba(68, 95, 64, 0.10),
        rgba(165, 90, 82, 0.08),
        transparent 70%
      );

      filter: blur(50px);

      pointer-events: none;

      z-index: -2;
    }

    /* ---------------- */
    /* RAINBOW BALL     */
    /* ---------------- */

    .rainbow-ball {

      position: fixed;

      width: 30px;
      height: 30px;

      border-radius: 50%;

      top: 70%;
      left: 15%;

      cursor: pointer;

      z-index: 20;

      background:
        radial-gradient(
          circle at 30% 30%,
          rgba(255,255,255,0.95),
          transparent 28%
        ),
        conic-gradient(
          from 0deg,
          #ff5f6d,
          #ffc371,
          #47cf73,
          #4facfe,
          #7b61ff,
          #ff5f6d
        );

      box-shadow:
        0 0 14px rgba(255,255,255,0.30),
        0 0 30px rgba(255,255,255,0.15);

      transition:
        transform 0.15s ease;
    }

    .rainbow-ball:hover {
      transform: scale(1.15);
    }

    /* ---------------- */
    /* CLICK COUNTER    */
    /* ---------------- */

    .click-counter {

      position: fixed;

      left: 15%;
      top: calc(70% - 24px);

      transform: translateX(-50%);

      text-align: center;

      font-size: 1rem;
      font-weight: 700;

      color: rgba(0,0,0,0.7);

      pointer-events: none;

      z-index: 25;

      opacity: 0;

      transition:
        left 2.2s cubic-bezier(.22,1,.36,1),
        top 2.2s cubic-bezier(.22,1,.36,1),
        opacity 0.35s ease;
    }

    .click-counter.visible {
      opacity: 1;
    }

    /* ---------------- */
    /* SPIN PHYSICS     */
    /* ---------------- */

    .rainbow-ball {

      --rotation: 0deg;
    }

    .rainbow-ball.spinning {

      animation:
        rainbowSpin 1.2s linear infinite;
    }

    .rainbow-ball.slowing {

      animation:
        rainbowSlow 1.4s cubic-bezier(.22,1,.36,1) forwards;
    }

    @keyframes rainbowSpin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rainbowSlow {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(180deg);
      }
    }

    /* ---------------- */
    /* MOBILE OPTIMIZE  */
    /* ---------------- */

    @media (max-width: 768px) {

      .title {
        top: 18px;
      }

      .hero {
        padding-top: 70px;
      }

      .rainbow-ball {

        width: 26px;
        height: 26px;
      }
    }

  </style>
</head>

<body>

  <!-- Stars -->
  <div
    class="stars"
    id="stars"
  ></div>

  <!-- Click Counter -->
  <div
    class="click-counter"
    id="clickCounter"
  >
    0
  </div>

  <!-- Rainbow Ball -->
  <div
    class="rainbow-ball"
    id="rainbowBall"
  ></div>

  <!-- Hero -->
  <section class="hero">

    <h1
      class="title"
      id="title"
    >
      Ruuvo
    </h1>

  </section>

  <script>

    const title =
      document.getElementById("title");

    const starsContainer =
      document.getElementById("stars");

    const rainbowBall =
      document.getElementById("rainbowBall");

    const clickCounter =
      document.getElementById("clickCounter");

    /* ---------------------- */
    /* DYNAMIC STAR GENERATOR */
    /* ---------------------- */

    function createStars() {

      starsContainer.innerHTML = "";

      const pageHeight =
        document.body.scrollHeight;

      const pageWidth =
        window.innerWidth;

      const STAR_COUNT = Math.floor(
        (pageWidth * pageHeight) / 18000
      );

      for (let i = 0; i < STAR_COUNT; i++) {

        const star =
          document.createElement("div");

        star.classList.add("star");

        star.style.left =
          Math.random() * pageWidth + "px";

        star.style.top =
          Math.random() * pageHeight + "px";

        let size;

        if (Math.random() > 0.94) {

          size =
            Math.random() * 12 + 5;

        } else {

          const mobileBoost =
            Math.max(
              1,
              700 / pageWidth
            );

          size =
            (Math.random() * 3 + 2)
            * mobileBoost;
        }

        star.style.width =
          size + "px";

        star.style.height =
          size + "px";

        star.style.opacity =
          Math.random() * 0.8 + 0.2;

        star.style.animationDuration =
          (Math.random() * 4 + 3) + "s";

        star.style.animationDelay =
          Math.random() * 5 + "s";

        starsContainer.appendChild(star);
      }
    }

    createStars();

    window.addEventListener(
      "resize",
      createStars
    );

    /* ---------------- */
    /* TITLE ANIMATION  */
    /* ---------------- */

    window.addEventListener(
      "scroll",
      () => {

        const scrollY =
          window.scrollY;

        const scale = Math.max(
          0.4,
          1 - scrollY / 1000
        );

        title.style.transform =
          `translateX(-50%) scale(${scale})`;
      }
    );

    /* ---------------- */
    /* RAINBOW BALL     */
    /* ---------------- */

    let currentX =
      window.innerWidth * 0.15;

    let currentY =
      window.innerHeight * 0.70;

    let spinningTimeout;

    let clickCount = 0;

    rainbowBall.addEventListener(
      "click",
      () => {

        // Count clicks
        clickCount++;

        clickCounter.textContent =
          clickCount;

        // Fade in
        clickCounter.classList.add(
          "visible"
        );

        clearTimeout(
          spinningTimeout
        );

        // Remove slowdown if re-clicked
        rainbowBall.classList.remove(
          "slowing"
        );

        // Keep spinning active
        rainbowBall.classList.add(
          "spinning"
        );

        const margin = 60;

        const maxX =
          window.innerWidth - margin;

        const maxY =
          window.innerHeight - margin;

        let randomX;
        let randomY;

        let distance = 0;

        // Prevent tiny movement
        while (distance < 220) {

          randomX =
            Math.random() * maxX;

          randomY =
            Math.random() * maxY;

          distance = Math.sqrt(
            Math.pow(randomX - currentX, 2) +
            Math.pow(randomY - currentY, 2)
          );
        }

        currentX = randomX;
        currentY = randomY;

        /* Smooth movement */

        rainbowBall.style.transition =
          "left 2.2s cubic-bezier(.22,1,.36,1), top 2.2s cubic-bezier(.22,1,.36,1)";

        rainbowBall.style.left =
          randomX + "px";

        rainbowBall.style.top =
          randomY + "px";

        // Counter follows ball

        clickCounter.style.left =
          randomX + "px";

        clickCounter.style.top =
          (randomY - 24) + "px";

        // Slow spin naturally

        spinningTimeout = setTimeout(
          () => {

            rainbowBall.classList.remove(
              "spinning"
            );

            rainbowBall.classList.add(
              "slowing"
            );

            // Fade counter out
            clickCounter.classList.remove(
              "visible"
            );

            // Fully stop

            setTimeout(() => {

              rainbowBall.classList.remove(
                "slowing"
              );

            }, 1400);

          },
          2200
        );
      }
    );

  </script>

</body>
</html>
